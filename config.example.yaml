# Pittsburgh Commute Analysis Tool - Configuration

# Work Location
work_address: "5000 Forbes Ave, Pittsburgh, PA"
# Optional: skip geocoding by giving coordinates directly
# work_lat: 40.4440
# work_lon: -79.9465

# Heat Map
grid_spacing: 500          # feet between grid points
heatmap_radius_miles: 8.0  # grid radius around work

# Commute Constraints
walking_speed: 4.0   # mph
max_transfers: 1     # maximum number of bus transfers
max_trip_time: 90    # minutes - trips longer than this count as unreachable

# Score: the Nth percentile of door-to-door travel time over all departure
# minutes in the window (wait time included). One of: 10, 25, 50, 80, 95.
score_percentile: 80

# Time Window - departure minutes sampled (every minute)
time_window_start: "06:00"
time_window_end: "19:00"

# Simulated service date. "auto" picks the next Wednesday covered by the
# GTFS feed's calendar; or set an explicit weekday like "2026-06-17".
analysis_date: "auto"

# Data Paths
gtfs_path: "data/GTFS.zip"           # Pittsburgh Regional Transit GTFS feed
osm_path: "data/pittsburgh.osm.pbf"  # cropped OSM extract (src/crop_osm.py)
